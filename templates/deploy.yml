apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.appName }}
  labels:
    project: {{ .Values.projectName }}
    app: {{ .Values.appName }}
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
    type: RollingUpdate
  selector:
    matchLabels:
      project: {{ .Values.projectName }}
      app: {{ .Values.appName }}
  template:
    metadata:
      labels:
        project: {{ .Values.projectName }}
        app: {{ .Values.appName }}
    spec:
{{ if .Values.tmpMount.enabled | default false }}
      volumes:
      - name: tmp-mount
        emptyDir: {}
{{ end }}
      serviceAccountName: {{ .Values.appName }}
      securityContext:
        runAsUser: 1000
      containers:
{{ if eq .Values.appName "frontend" }}
      - args:
        - -nginx.scrape-uri=http://127.0.0.1/health
        image: nginx/nginx-prometheus-exporter:latest
        name: exporter
        ports:
        - containerPort: 9113
          name: metrics
{{ end }}
      - name: {{ .Values.appName }}
        image: 739561048503.dkr.ecr.us-east-1.amazonaws.com/{{ .Values.appName }}:{{ .Values.appVersion }}
        imagePullPolicy: Always
{{ if .Values.tmpMount.enabled | default false }}
        volumeMounts:
        - name: tmp-mount
          mountPath: {{ .Values.tmpMount.tmpDir }}
{{ end }}
        securityContext:
          readOnlyRootFilesystem: true
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 30"]
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.appPort }}
          failureThreshold: 1
          periodSeconds: 10
          initialDelaySeconds: 120
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.appPort }}
          failureThreshold: 10
          periodSeconds: 10
          initialDelaySeconds: 30
        resources:
          limits:
            cpu: {{ .Values.resources.limits_cpu | quote }}
            memory: {{ .Values.resources.limits_mem | quote }}
          requests:
            cpu: {{ .Values.resources.requests_cpu | quote }}
            memory: {{ .Values.resources.requests_mem | quote }}
        ports:
        - containerPort: {{ .Values.appPort }}
          name: default
        envFrom:
        - configMapRef:
            name: {{ .Values.appName }}

